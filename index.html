lassName='grid';for(const {c,i} of list){const t=document.createElement('button');t.type='button';t.className='tile';t.style.setProperty('--a',colors[a]);t.innerHTML='<span class="q">?</span><img alt=""><span class="name"></span>';t.querySelector('img').src=c.img;t.querySelector('.name').textContent=c.name;t.addEventListener('click',()=>{if(solved.has(i)||ended)return;selected=i;tiles.forEach(x=>x.classList.remove('selected'));t.classList.add('selected');document.querySelector('#hintPanel').hidden=false;document.querySelector('#hintOut').textContent='選択中：'+c.attribute+' ／ ヒントを選んでね。'});g.append(t);tiles[i]=t}grid.append(g)}document.querySelector('#legend').innerHTML=attrOrder.map(a=>'<span class="dot" style="--a:'+colors[a]+'"></span>'+a).join('')}function status(){document.querySelector('#count').textContent=solved.size+' / '+chars.length;document.querySelector('#remain').textContent='残り '+(chars.length-solved.size);document.querySelector('#clock').textContent=clock();save()}function finish(){elapsed=time();running=false;ended=true;tiles.forEach((t,i)=>{if(!solved.has(i)){t.classList.add('reveal');t.querySelector('.q').textContent=''}});document.querySelector('#answer').disabled=true;document.querySelector('#form button').disabled=true;document.querySelector('#giveup').disabled=true;document.querySelector('#message').textContent='終了：'+solved.size+' / '+chars.length+'人正解';status()}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#answer'),v=norm(input.value);if(!v)return;if(ended)return;if(!running){running=true;started=Date.now()}const i=chars.findIndex((c,j)=>!solved.has(j)&&(norm(c.name)===v||norm(c.reading)===v));if(i>=0){solved.add(i);tiles[i].classList.add('done');tiles[i].classList.remove('selected');if(selected===i)selected=-1;document.querySelector('#message').textContent='正解：'+chars[i].name;input.value='';if(solved.size===chars.length)finish()}else document.querySelector('#message').textContent='その名前は見つかりません。';status()});document.querySelector('#giveup').onclick=finish;document.querySelector('#hintToggle').onclick=()=>document.querySelector('#hintPanel').hidden=!document.querySelector('#hintPanel').hidden;function hint(k){if(selected<0){document.querySelector('#hintOut').textContent='先に「？」マスを選んでね。';return}const c=chars[selected];seen[k].add(selected);document.querySelector('#hintOut').textContent=(k==='faction'?'陣営：'+c.faction:'実装バージョン：'+c.version);save()}document.querySelector('#factionHint').onclick=()=>hint('faction');document.querySelector('#versionHint').onclick=()=>hint('version');document.querySelector('#filter').onclick=e=>{filter=!filter;e.target.classList.toggle('soft',filter);tiles.forEach((t,i)=>t.classList.toggle('hide',filter&&solved.has(i)))};document.querySelector('#restart').onclick=()=>{if(!confirm('回答状況を消して最初からやり直しますか？'))return;localStorage.removeItem(key);location.reload()};draw();chars.forEach((_,i)=>{if(solved.has(i))tiles[i]?.classList.add('done')});if(ended)finish();status();setInterval(()=>{document.querySelector('#clock').textContent=clock();save()},1000);</script></body></html>
